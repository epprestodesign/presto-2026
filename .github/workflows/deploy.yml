name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
          # Public URL of the separately-hosted imagery library (no secret).
          VITE_IMAGERY_URL: "https://epprestodesign.github.io/presto-ds-imagery"
          # Google Maps JS key for the Hotel Map pattern. Stored as a repo secret;
          # restrict it by HTTP referrer + Maps JS API in Google Cloud Console.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # Build the clickable booking-journey prototype (a separate Vite app that
      # reuses the real library components) and nest it under the Storybook site
      # so it's served at /presto-2026/prototype/. It has no deps of its own —
      # it resolves vue/quasar/vite from the repo's node_modules installed above.
      - name: Build prototype (booking journey)
        working-directory: prototype
        run: node ../node_modules/vite/bin/vite.js build --base=/presto-2026/prototype/
        env:
          VITE_IMAGERY_URL: "https://epprestodesign.github.io/presto-ds-imagery"
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Nest prototype under Storybook
        run: cp -r prototype/dist storybook-static/prototype

      # Mobile prototype — a device-frame showcase that embeds the prototype above
      # in a 390px iframe (its `../prototype/` src resolves to the sibling deploy).
      - name: Build mobile prototype (device-frame showcase)
        working-directory: prototype-mobile
        run: node ../node_modules/vite/bin/vite.js build --base=/presto-2026/prototype-mobile/

      - name: Nest mobile prototype under Storybook
        run: cp -r prototype-mobile/dist storybook-static/prototype-mobile

      # Custom Fees Request — a fork of the booking journey above, kept as its own
      # app so fee-request explorations can diverge without touching the shipped
      # journey. Same zero-deps setup; served at /presto-2026/prototype-custom-fees/.
      - name: Build prototype (Custom Fees Request)
        working-directory: prototype-custom-fees
        run: node ../node_modules/vite/bin/vite.js build --base=/presto-2026/prototype-custom-fees/
        env:
          VITE_IMAGERY_URL: "https://epprestodesign.github.io/presto-ds-imagery"
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Nest Custom Fees Request under Storybook
        run: cp -r prototype-custom-fees/dist storybook-static/prototype-custom-fees

      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
